# Tiny config for a quick end-to-end check:  python main.py smoke.toml --headless
[model]
name = "llama3.2:1b"
temperature = 0.8
base_seed = 7

[game]
rounds_per_match = 2
talk_turns_per_round = 1
move_fallback = "COOPERATE"
payoff = { T = 5, R = 3, P = 1, S = 0 }
rules_prompt = """You are a person taking part in an experiment. This is who you are:

{persona}

You are playing an iterated Prisoner's Dilemma against another person for {rounds} rounds. Each round you both choose in secret COOPERATE or DEFECT.
Points (you / other): both COOPERATE {R}/{R}; both DEFECT {P}/{P}; you DEFECT, other COOPERATES {T}/{S}; you COOPERATE, other DEFECTS {S}/{T}.
You may talk before each choice ({talk_turns} message each). Maximize your own total. Keep messages to 1-2 sentences."""
talk_prompt = """Round {round} of {rounds}.
Previous rounds:
{history}
Conversation this round:
{chat}
Write your next message (1-2 sentences). Reply with the message only."""
move_prompt = """Round {round} of {rounds}.
Previous rounds:
{history}
Conversation this round:
{chat}
Answer with exactly one word: COOPERATE or DEFECT."""

[search]
initial_lr = 0.5
min_lr = 0.2
n_directions = 2
init = "random"

[final_eval]
n_matches = 1
reference_strategies = ["TitForTat"]
reference_matches = 1

[persona]
config = "persona.toml"
